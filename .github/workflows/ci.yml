name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cada submodule é um workspace próprio, então cada um tem seu job.
jobs:
  daemon:
    name: daemon (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustploy-daemon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustploy-daemon
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  shared:
    name: shared (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustploy-shared
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustploy-shared
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gui:
    name: gui (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustploy-gui
    steps:
      # Mesmos pacotes do build da release (GTK/bandeja/xdo/fontconfig).
      - name: Install system packages
        # Antes do checkout a pasta do job ainda não existe.
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev libfontconfig1-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustploy-gui
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --bins + os testes de integração (templates_render roda o mlua real).
      - run: cargo test --workspace
      # Testes Luau (tests/**/*.test.luau). O CLI fica fixo em 0.7.1 (o primeiro com `glacier test`
      # que acha views/scripts no require) e o binário é cacheado; ao subir a versão, mude as duas
      # ocorrências abaixo.
      - uses: actions/cache@v4
        id: glacier-cli
        with:
          path: ~/.cargo/bin/glacier
          key: glacier-cli-0.7.1-${{ runner.os }}
      - if: steps.glacier-cli.outputs.cache-hit != 'true'
        run: cargo install glacier-cli --locked --version 0.7.1
      - run: glacier test
