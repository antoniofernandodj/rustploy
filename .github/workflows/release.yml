name: Release

on:
  push:
    tags:
      - 'v*'
  # Disparo manual: compila e guarda os pacotes como artefatos, mas NÃO publica release
  # (o job `release` só roda em tag). Serve para testar o pipeline sem criar tag.
  workflow_dispatch:

jobs:
  # .deb do daemon, o caminho de instalação suportado (install.sh baixa dele).
  # Compila dentro de um Ubuntu 22.04 (glibc 2.35) para o binário rodar também em
  # Debian 12 e Ubuntu 22.04/24.04; um build no runner mais novo exigiria glibc nova.
  # O arm64 compila nativo no runner ARM, sem cross.
  build-daemon-deb:
    name: Build rustployd (.deb ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libssl-dev git dpkg-dev ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustploy-daemon/target
          key: daemon-deb-${{ matrix.arch }}-${{ hashFiles('rustploy-daemon/Cargo.lock') }}
          restore-keys: daemon-deb-${{ matrix.arch }}-

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # `-p rustploy` compila os dois binários do pacote: rustployd e rustployd-fw.
      - name: Build daemon
        working-directory: rustploy-daemon
        run: cargo build --release --locked -p rustploy

      - name: Build .deb
        run: cargo deb --manifest-path rustploy-daemon/crates/daemon/Cargo.toml --no-build -o dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustployd-deb-${{ matrix.arch }}
          path: dist/rustployd_*.deb

  # .deb do app desktop. Compila no mesmo Ubuntu 22.04 do daemon: um build no runner
  # mais novo (24.04, glibc 2.39) não instalaria em Ubuntu 22.04 nem Debian 12.
  build-gui-linux:
    name: Build rustploy-gui (.deb)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system packages
        run: |
          apt-get update
          # GTK e glib (diálogos e bandeja), appindicator (bandeja), xdo, fontconfig (texto do iced/wgpu).
          apt-get install -y curl build-essential pkg-config git dpkg-dev ca-certificates \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libfontconfig1-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustploy-gui/target
          key: gui-deb-amd64-${{ hashFiles('rustploy-gui/Cargo.lock') }}
          restore-keys: gui-deb-amd64-

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # Runtime assets (views/**/*, incl. views/scripts/{app.luau,fmt/,handlers/,
      # net/}) are declared in rustploy-gui/Cargo.toml's
      # [package.metadata.deb] assets — cargo-deb globs them into the package
      # automatically; nothing to copy by hand here (unlike the Windows job
      # below, which has no such tool and must assemble the tree manually).
      - name: Build .deb
        run: cargo deb --manifest-path rustploy-gui/Cargo.toml -o dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustploy-gui-linux-deb
          path: dist/*.deb

  build-gui-windows:
    name: Build rustploy-gui (Windows .zip)
    runs-on: ubuntu-latest
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rustploy-gui/target
          key: ${{ runner.os }}-gui-win-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gui-win-cargo-

      # ring pede llvm-lib e aws-lc-sys pede NASM ao compilar para o alvo MSVC. Os headers do
      # MSVC STL baixados pelo cargo-xwin exigem Clang >= 19 (o do runner é o 18): LLVM 20 do apt.llvm.org.
      - name: Install LLVM 20 toolchain and NASM
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y llvm-20 lld-20 nasm
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
          ls /usr/lib/llvm-20/bin | grep -E '^(clang-cl|lld-link|llvm-lib)$'

      - name: Install cargo-xwin
        run: cargo install cargo-xwin

      - name: Build (cross-compile to Windows via cargo-xwin)
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo xwin build --release --manifest-path rustploy-gui/Cargo.toml --target x86_64-pc-windows-msvc

      # Publica o .exe cru para o job de assinatura (SignPath) consumir.
      - name: Upload unsigned .exe
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: rustploy-gui-exe-unsigned
          path: rustploy-gui/target/x86_64-pc-windows-msvc/release/rustploy-gui.exe
          if-no-files-found: error

  # Assina o .exe com o SignPath (tier OSS, grátis para projetos open source).
  # INERTE até o projeto estar registrado: o job só roda quando a variável de
  # repositório SIGNPATH_ORGANIZATION_ID existe (Settings > Secrets and
  # variables > Actions > Variables). Passos de registro em
  # docs/windows-code-signing.md. Sem isso, o pipeline segue com o .exe cru.
  sign-gui-windows:
    name: Sign rustploy-gui (SignPath)
    needs: build-gui-windows
    runs-on: ubuntu-latest
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rustploy
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'exe' }}
          github-artifact-id: ${{ needs.build-gui-windows.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed .exe
        uses: actions/upload-artifact@v4
        with:
          name: rustploy-gui-exe-signed
          path: signed/rustploy-gui.exe
          if-no-files-found: error

  # Monta a árvore de assets ao redor do .exe e gera o .zip. Roda sempre; usa o
  # .exe assinado se o job de assinatura tiver rodado, senão o cru.
  package-gui-windows:
    name: Package rustploy-gui (Windows .zip)
    needs: [build-gui-windows, sign-gui-windows]
    if: ${{ always() && needs.build-gui-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download signed .exe
        if: ${{ needs.sign-gui-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rustploy-gui-exe-signed
          path: exe

      - name: Download unsigned .exe (fallback)
        if: ${{ needs.sign-gui-windows.result != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: rustploy-gui-exe-unsigned
          path: exe

      # Same tree assets::locate_and_chdir() expects next to the .exe (portable
      # layout) — mirrors `make rustploy-gui-windows-dist`. Keep the two in
      # sync: this is the one packaging path with no glob/manifest tool behind
      # it (unlike the .deb job above), so a renamed/new asset dir has to be
      # added by hand in BOTH places. `views/` is copied WHOLE (there is no
      # separate `styles/` directory anymore — it moved under
      # `views/styles/`), so it already carries app.gss/theme.json along with
      # the templates and the Luau layer.
      - name: Package
        run: |
          set -e
          DIST=dist/rustploy-gui-windows
          mkdir -p "$DIST/assets"
          cp exe/rustploy-gui.exe "$DIST/"
          cp -r rustploy-gui/views "$DIST/"
          cp -r rustploy-gui/assets/icons "$DIST/assets/"
          cp -r rustploy-gui/assets/blueprint-logos "$DIST/assets/"
          test -f "$DIST/views/scripts/app.luau"
          test -f "$DIST/views/styles/app.gss"
          printf 'Descompacte e rode rustploy-gui.exe (duplo-clique).\r\n' > "$DIST/LEIA-ME.txt"
          cd dist && zip -qr "rustploy-gui-windows-${{ github.ref_name }}.zip" rustploy-gui-windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustploy-gui-windows-zip
          path: dist/rustploy-gui-windows-*.zip

  release:
    needs: [build-daemon-deb, build-gui-linux, package-gui-windows]
    # `always()` porque o job de assinatura (opcional) é pulado quando o SignPath não está configurado, e um
    # ancestral pulado faz o `if` padrão (success()) pular este job. As condições abaixo fazem a checagem certa.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build-daemon-deb.result == 'success' && needs.build-gui-linux.result == 'success' && needs.package-gui-windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        run: ls -la

      - name: Generate checksums
        run: sha256sum *.deb rustploy-gui-windows-*.zip > checksums.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rustployd_*.deb
            rustploy-gui_*.deb
            rustploy-gui-windows-*.zip
            checksums.sha256
          generate_release_notes: true

  # Atualiza os servidores do dono assim que a release é publicada: o mesmo comando que ele rodava à mão
  # (pull do agregador + submódulos + `make install-rustploy`, que compila e instala na própria máquina).
  # Só roda em tag, depois do job `release`. Segredos (Settings > Secrets and variables > Actions):
  #   DEPLOY_SSH_KEY     chave privada (sem senha) autorizada nos dois servidores
  #   DEPLOY_KNOWN_HOSTS saída de `ssh-keyscan -t ed25519 HOST...` (fixa a identidade dos servidores)
  # Sem os segredos o job é pulado. `fail-fast: false`: um servidor fora do ar não impede o outro.
# Desativado: o deploy automático nos servidores não funciona. Reative removendo o "#" abaixo.
